<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>等级考试真题练习（编程题）</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f0f7ff;
            font-family: 'Segoe UI', Roboto, 'Noto Sans', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 950px;
            width: 100%;
            background: white;
            border-radius: 32px;
            padding: 24px 28px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: #0a2b3e;
        }

        .sub {
            text-align: center;
            color: #2c6e9e;
            font-size: 0.85rem;
            border-bottom: 2px solid #e2edf7;
            display: inline-block;
            width: auto;
            margin: 0 auto 20px auto;
            padding-bottom: 6px;
        }

        .info-panel {
            display: flex;
            justify-content: center;
            gap: 28px;
            background: #f8fafd;
            padding: 16px 20px;
            border-radius: 28px;
            margin-bottom: 28px;
            flex-wrap: wrap;
            border: 1px solid #dce5f0;
        }

        .field {
            display: flex;
            align-items: baseline;
            gap: 8px;
            background: white;
            padding: 5px 14px;
            border-radius: 40px;
        }

        .field label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #1f4e7a;
        }

        .field input,
        .field select {
            padding: 8px 12px;
            border: 1px solid #cbdde9;
            border-radius: 28px;
            font-size: 0.9rem;
            background: white;
            outline: none;
        }

        .programming-section {
            margin: 24px 0 20px;
        }

        .question-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 16px 20px;
            margin-bottom: 18px;
            border: 1px solid #e9f0f5;
        }

        .question-label {
            font-weight: 700;
            font-size: 1.1rem;
            color: #0f3b5c;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .question-label::before {
            content: "✍️";
            font-size: 1.2rem;
        }

        .programming-url {
            width: 100%;
            padding: 14px 16px;
            font-size: 0.95rem;
            border: 1px solid #cfe0ec;
            border-radius: 20px;
            font-family: 'Segoe UI', monospace;
            background: #fefefe;
        }

        .programming-url:focus {
            border-color: #2c7ab1;
            outline: none;
            box-shadow: 0 0 0 3px rgba(44,122,177,0.1);
        }

        .action-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 18px;
            margin: 28px 0 20px;
        }

        button {
            border: none;
            padding: 12px 26px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            background: #eef3fc;
            color: #1f5a7e;
        }

        .btn-primary {
            background: #1f5a7e;
            color: white;
        }

        .btn-primary:hover {
            background: #0e4160;
        }

        .btn-secondary {
            background: #e9f0f5;
            color: #1f5a7e;
            border: 1px solid #c2d6e6;
        }

        .btn-secondary:hover {
            background: #dce8f0;
        }

        .btn-warning {
            background: #ffe8e0;
            color: #b34e1a;
            border: 1px solid #ffccb3;
        }

        .btn-warning:hover {
            background: #ffd9cc;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .msg-area {
            background: #eef3fa;
            border-radius: 28px;
            padding: 14px 20px;
            margin-top: 20px;
            font-size: 0.85rem;
            text-align: center;
            color: #1f4e6e;
            border-left: 4px solid #2c7ab1;
        }

        .msg-success {
            background: #e1f7e8;
            border-left-color: #2b8c5e;
            color: #0a5e3a;
        }

        .msg-error {
            background: #ffe6e5;
            border-left-color: #c73e2d;
            color: #a13023;
        }

        .footer-note {
            text-align: center;
            font-size: 0.7rem;
            color: #7e9ab3;
            margin-top: 20px;
            border-top: 1px solid #e2edf7;
            padding-top: 14px;
        }

        @media (max-width: 640px) {
            .container {
                padding: 18px;
            }

            .question-card {
                padding: 12px 14px;
            }

            .action-bar button {
                padding: 8px 20px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>📘 等级考试真题练习 <span style="font-size:1.2rem;">（编程题）</span></h2>
        <div style="text-align: center; margin-bottom: 12px;">
            <div class="sub">✏️ 请将每道编程题的作品网址填入下方文本框</div>
        </div>

        <div class="info-panel">
            <div class="field"><label>👤 姓名</label><input type="text" id="studentName" placeholder="例如：张小明" autocomplete="off"></div>
            <div class="field"><label>📊 等级</label>
                <select id="levelSelect">
                    <option value="二级">二级</option>
                    <option value="三级">三级</option>
                    <option value="四级">四级</option>
                </select>
            </div>
            <div class="field"><label>📌 套数</label><input type="text" id="setNumber" placeholder="1" value="1" style="width:80px"></div>
        </div>

        <div class="programming-section">
            <div class="question-card">
                <div class="question-label">编程题 1</div>
                <input type="text" class="programming-url" id="prog1" placeholder="粘贴作品网址，例如：https://scratch.mit.edu/projects/xxxxx" value="">
            </div>
            <div class="question-card">
                <div class="question-label">编程题 2</div>
                <input type="text" class="programming-url" id="prog2" placeholder="粘贴作品网址或项目链接">
            </div>
            <div class="question-card">
                <div class="question-label">编程题 3</div>
                <input type="text" class="programming-url" id="prog3" placeholder="粘贴作品网址">
            </div>
            <div class="question-card">
                <div class="question-label">编程题 4</div>
                <input type="text" class="programming-url" id="prog4" placeholder="粘贴作品网址">
            </div>
        </div>

        <div class="action-bar">
            <button id="submitFinalBtn" class="btn-primary">📤 提交答案</button>
            <button id="saveDraftBtn" class="btn-secondary">💾 保存已做题目答案</button>
            <button id="extractDeleteBtn" class="btn-warning">📥 提取已做题目答案并删除记录</button>
        </div>

        <div id="messageBox" class="msg-area">
            💡 提示：填写姓名、等级、套数后，可保存/提交编程题网址。
        </div>
        <div class="footer-note">
            ⚡ 每次提交前会检查是否已存在记录，避免重复提交。<br>
            💾 “保存已做题目答案”可随时保存草稿；📥 “提取”会载入已存答案并从表格中删除该行数据。
        </div>
    </div>

    <script>
        (function() {
            // ======================= 配置 =======================
            // 使用您最新提供的 Google Apps Script Web App 地址
            const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwH5Ez6mxlbnmF39xjB4BCnsdoL3ZaJl4N5iEs5iTzNLKUcMiy-GgO5jRpFhr52XL3R/exec';

            // 获取dom元素
            const nameInput = document.getElementById('studentName');
            const levelSelect = document.getElementById('levelSelect');
            const setNumberInput = document.getElementById('setNumber');
            const progInputs = {
                1: document.getElementById('prog1'),
                2: document.getElementById('prog2'),
                3: document.getElementById('prog3'),
                4: document.getElementById('prog4')
            };
            const submitBtn = document.getElementById('submitFinalBtn');
            const saveDraftBtn = document.getElementById('saveDraftBtn');
            const extractBtn = document.getElementById('extractDeleteBtn');
            const messageDiv = document.getElementById('messageBox');

            // 辅助显示消息
            function showMessage(text, isError = false, isSuccess = false) {
                messageDiv.textContent = text;
                messageDiv.classList.remove('msg-success', 'msg-error');
                if (isError) {
                    messageDiv.classList.add('msg-error');
                } else if (isSuccess) {
                    messageDiv.classList.add('msg-success');
                }
                setTimeout(() => {
                    if (!isError && !isSuccess) return;
                    if (messageDiv.textContent === text) {
                        messageDiv.classList.remove('msg-success', 'msg-error');
                    }
                }, 4000);
            }

            // 获取当前四个编程题的答案数组
            function getProgrammingAnswers() {
                return [
                    progInputs[1].value.trim(),
                    progInputs[2].value.trim(),
                    progInputs[3].value.trim(),
                    progInputs[4].value.trim()
                ];
            }

            // 将答案数组填充到输入框
            function fillProgrammingAnswers(answersArray) {
                if (!answersArray || !Array.isArray(answersArray)) return false;
                for (let i = 0; i < 4; i++) {
                    const val = answersArray[i] || '';
                    if (progInputs[i + 1]) progInputs[i + 1].value = val;
                }
                return true;
            }

            // 验证基本信息
            function validateBasicInfo() {
                const name = nameInput.value.trim();
                const setNum = setNumberInput.value.trim();
                if (!name) {
                    showMessage('❌ 请填写姓名', true);
                    return null;
                }
                if (!setNum) {
                    showMessage('❌ 请输入套数', true);
                    return null;
                }
                if (isNaN(parseInt(setNum))) {
                    showMessage('❌ 套数必须为数字', true);
                    return null;
                }
                return { name, level: levelSelect.value, setNumber: setNum };
            }

            // 通用请求函数 (封装POST)
            async function callApi(action, extraBodyParams = {}) {
                const info = validateBasicInfo();
                if (!info) throw new Error('基本信息无效');
                
                const bodyParams = new URLSearchParams();
                bodyParams.append('action', action);
                bodyParams.append('name', info.name);
                bodyParams.append('level', info.level);
                bodyParams.append('setNumber', info.setNumber);
                
                for (const [key, value] of Object.entries(extraBodyParams)) {
                    if (value !== undefined && value !== null) {
                        bodyParams.append(key, value);
                    }
                }
                
                console.log(`请求API: ${action}`, bodyParams.toString());
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: bodyParams.toString()
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: 网络错误`);
                }
                const data = await response.json();
                console.log(`API响应: ${action}`, data);
                return data;
            }

            // 1. 提交答案 (最终提交, 检查是否已存在, 不重复保存)
            async function handleFinalSubmit() {
                const answers = getProgrammingAnswers();
                const hasAny = answers.some(a => a !== '');
                if (!hasAny) {
                    showMessage('⚠️ 请至少填写一个编程题的作品网址再提交', true);
                    return;
                }
                
                setButtonsLoading(true, '提交中...');
                try {
                    const answersStr = answers.join(',');
                    const result = await callApi('submitProgrammingFinal', { answers: answersStr });
                    
                    if (result && result.success === true) {
                        showMessage(`✅ 提交成功！${result.message || '编程题答案已存入系统。'}`, false, true);
                    } else {
                        let errMsg = result?.message || '提交失败，请稍后重试';
                        if (errMsg.includes('已存在') || errMsg.includes('重复')) {
                            errMsg = '⚠️ 该学生此等级套数已提交过答案，请勿重复提交。如需修改请使用“保存已做题目答案”覆盖草稿。';
                        }
                        showMessage(`❌ ${errMsg}`, true);
                    }
                } catch (error) {
                    console.error(error);
                    showMessage(`网络错误: ${error.message}`, true);
                } finally {
                    setButtonsLoading(false);
                }
            }

            // 2. 保存已做题目答案 (草稿，可覆盖)
            async function handleSaveDraft() {
                const answers = getProgrammingAnswers();
                const hasAny = answers.some(a => a !== '');
                if (!hasAny) {
                    showMessage('✏️ 当前没有任何编程题网址，无需保存', false);
                    return;
                }
                
                setButtonsLoading(true, '保存中...');
                try {
                    const answersStr = answers.join(',');
                    const result = await callApi('saveProgrammingDraft', { answers: answersStr });
                    if (result && result.success === true) {
                        showMessage(`💾 草稿已保存！${result.message || '下次可使用提取功能加载。'}`, false, true);
                    } else {
                        showMessage(`保存失败: ${result?.message || '未知错误'}`, true);
                    }
                } catch (error) {
                    console.error(error);
                    showMessage(`保存草稿失败: ${error.message}`, true);
                } finally {
                    setButtonsLoading(false);
                }
            }

            // 3. 提取已做题目答案 (获取并删除)
            async function handleExtractAndDelete() {
                setButtonsLoading(true, '提取中...');
                try {
                    const result = await callApi('fetchAndDeleteProgramming');
                    
                    if (result && result.success === true && result.answers) {
                        let answerArr = [];
                        if (typeof result.answers === 'string') {
                            answerArr = result.answers.split(',').slice(0, 4);
                        } else if (Array.isArray(result.answers)) {
                            answerArr = result.answers.slice(0, 4);
                        }
                        fillProgrammingAnswers(answerArr);
                        showMessage(`📥 已成功提取之前的答案并删除表格记录。${result.message || ''}`, false, true);
                    } else if (result && result.notFound === true) {
                        showMessage(`🔍 未找到该学生(姓名:${nameInput.value.trim()}, 等级:${levelSelect.value}, 套数:${setNumberInput.value.trim()}) 的编程题记录，无法提取。`, true);
                    } else {
                        showMessage(`提取失败: ${result?.message || '服务端错误'}`, true);
                    }
                } catch (error) {
                    console.error(error);
                    showMessage(`提取异常: ${error.message}`, true);
                } finally {
                    setButtonsLoading(false);
                }
            }

            // 按钮loading状态管理
            function setButtonsLoading(loading, customText = '处理中...') {
                const btns = [submitBtn, saveDraftBtn, extractBtn];
                if (loading) {
                    btns.forEach(btn => { btn.disabled = true; });
                    if (submitBtn.textContent === '📤 提交答案') submitBtn.setAttribute('data-original', submitBtn.textContent);
                    if (saveDraftBtn.textContent === '💾 保存已做题目答案') saveDraftBtn.setAttribute('data-original', saveDraftBtn.textContent);
                    if (extractBtn.textContent === '📥 提取已做题目答案并删除记录') extractBtn.setAttribute('data-original', extractBtn.textContent);
                    submitBtn.textContent = customText === '提交中...' ? customText : submitBtn.textContent;
                    saveDraftBtn.textContent = customText === '保存中...' ? customText : saveDraftBtn.textContent;
                    extractBtn.textContent = customText === '提取中...' ? customText : extractBtn.textContent;
                } else {
                    btns.forEach(btn => { btn.disabled = false; });
                    if (submitBtn.getAttribute('data-original')) submitBtn.textContent = submitBtn.getAttribute('data-original');
                    if (saveDraftBtn.getAttribute('data-original')) saveDraftBtn.textContent = saveDraftBtn.getAttribute('data-original');
                    if (extractBtn.getAttribute('data-original')) extractBtn.textContent = extractBtn.getAttribute('data-original');
                    if (submitBtn.textContent === '提交中...') submitBtn.textContent = '📤 提交答案';
                    if (saveDraftBtn.textContent === '保存中...') saveDraftBtn.textContent = '💾 保存已做题目答案';
                    if (extractBtn.textContent === '提取中...') extractBtn.textContent = '📥 提取已做题目答案并删除记录';
                }
            }

            // 注册事件监听
            submitBtn.addEventListener('click', handleFinalSubmit);
            saveDraftBtn.addEventListener('click', handleSaveDraft);
            extractBtn.addEventListener('click', handleExtractAndDelete);

            // Ctrl+Enter 快速提交答案
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    handleFinalSubmit();
                }
            });

            console.log('编程题练习系统已启动，使用脚本地址:', SCRIPT_URL);
            showMessage('✅ 系统就绪。请填写信息后使用“保存草稿”或“提交答案”。提取会获取记录并删除。', false);
        })();
    </script>
</body>
</html>
